{% extends "base.html" %}

{% block titulo %}Editar cancha{% endblock %}

{% block contenido %}
    <h2>Editar {{ cancha.nombre }}</h2>

    <form method="POST">
        <label>Nombre:</label>
        <input type="text" name="nombre" value="{{ cancha.nombre }}" required>

        <label>Tipo:</label>
        <select name="tipo">
            <option value="Fut 11" {% if cancha.tipo == "Fut 11" %}selected{% endif %}>Fut 11</option>
            <option value="Fut 5" {% if cancha.tipo == "Fut 5" %}selected{% endif %}>Fut 5</option>
            <option value="Futsal" {% if cancha.tipo == "Futsal" %}selected{% endif %}>Futsal</option>
        </select>

        <label>Piso:</label>
        <select name="piso">
            <option value="sintetico" {% if cancha.piso == "sintetico" %}selected{% endif %}>Sintético</option>
            <option value="natural" {% if cancha.piso == "natural" %}selected{% endif %}>Natural</option>
            <option value="madera" {% if cancha.piso == "madera" %}selected{% endif %}>Madera</option>
        </select>

        <label>
            <input type="checkbox" name="techo" {% if cancha.techo %}checked{% endif %}> Techada
        </label>

        <label> Precio $:</label>
        <input type="number" name="precio" value="{{ cancha.precio }}" required>

        <label>Nombre del archivo de foto:</label>
        <input type="text" name="foto" value="{{ cancha.foto }}">

        <label>
            <input type="checkbox" name="activa" {% if cancha.activa %}checked{% endif %}> Activa
        </label>

        <button type="submit">Guardar cambios</button>
    </form>
{% endblock %}
